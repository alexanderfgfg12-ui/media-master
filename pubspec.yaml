name: media_master
description: Music Player & Video Downloader - local music player and permitted direct media downloader.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.7
  just_audio: ^0.10.5
  dio: ^5.9.0
  flutter_file_dialog: ^3.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
