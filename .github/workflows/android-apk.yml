name: Build Media Master Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.mediamaster --project-name media_master .

      - name: Set Google Play target API level
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          for p in candidates:
              if p.exists():
                  s = p.read_text()
                  s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
                  s = s.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 36")
                  p.write_text(s)
          PY

      - name: Configure background audio service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('<application', '''<uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <application''', 1)
          s = s.replace('</application>', '''<service android:name="com.ryanheise.audioservice.AudioService"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true">
                  <intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter>
                </service>
                <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true">
                  <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter>
                </receiver>
              </application>''', 1)
          p.write_text(s)
          PY

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Google Play App Bundle
        run: flutter build appbundle --release

      - name: Upload Android release files
        uses: actions/upload-artifact@v4
        with:
          name: media-master-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
